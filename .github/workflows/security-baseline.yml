name: Security baseline
on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
permissions: {contents: read}
jobs: {scan: {runs-on: ubuntu-latest, steps: [
                                        {uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: {fetch-depth: 0}},
                                        {run: 'b=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1; curl -fsSLO $b/gitleaks_8.30.1_linux_x64.tar.gz; curl -fsSLO $b/gitleaks_8.30.1_checksums.txt; grep "gitleaks_8.30.1_linux_x64.tar.gz$" gitleaks_8.30.1_checksums.txt | sha256sum -c -; tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks; ./gitleaks git --redact=100 --config .gitleaks.toml --log-opts="--all"'}
                                      ]}}
